services:
  postgres:
    image: postgres:16
    container_name: samvad-postgres
    environment:
      POSTGRES_USER: samvad
      POSTGRES_PASSWORD: samvad
      POSTGRES_DB: samvad
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
